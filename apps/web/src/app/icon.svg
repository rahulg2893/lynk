    <circle cx="16" cy="15" r="10" fill="none" stroke="url(#a)" stroke-width="5"/>
    <circle cx="29" cy="19" r="10" fill="none" stroke="url(#b)" stroke-width="5"/>
    <circle cx="16" cy="15" r="10" fill="none" stroke="url(#a)" stroke-width="5" clip-path="url(#over)"/>

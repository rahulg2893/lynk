    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#aebcd6"/>
    </linearGradient>
    <clipPath id="over"><rect x="19" y="0" width="15" height="16"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <rect width="512" height="512" rx="114" fill="url(#glow)"/>
  <rect x="3" y="3" width="506" height="506" rx="111" fill="none" stroke="url(#edge)" stroke-width="6"/>
  <!-- The mark from Logo.tsx (viewBox 46x34), scaled and centred. -->
